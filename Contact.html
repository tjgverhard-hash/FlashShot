<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        @keyframes Moving {
            0%{transform: translateX(1000px);
            opacity: 0;
        }
            100%{transform: translateX(0px);
            opacity: 1;
        }
        }
        @keyframes hov {
            0%{transform: translateY(-5px);}
            50%{transform: translateY(5px);}
            100%{transform: translateY(-5px);}
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — FlashShot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="layout.css">
</head>
<body class="ContactUs">
    <div class="contact-page">
        <div class="contact-header">
            <div class="logo">
            </div>
            <div class="title">Contact form
                <a href="index.html"><img src="Img/Camera.png" alt=""></a>
            </div>
        </div>

        <div class="contact-nav">
            <div class="nav-item"><a href="index.html">Home</a></div>
            <div class="nav-item"><a href="AboutUs.html">About us</a></div>
            <div class="nav-item"><a href="Crew.html">Meet the Crew</a></div>
        </div>

        <div class="contact-content">
            <div class="contact-card">
                <div class="card-title"><b>Get in touch</b></div>
                <div class="contact-person-block">
                    <div class="person-name">N.V.T</div>
                    <div class="person-info">N.V.T</div>
                    <div class="person-info">Nil</div>
                </div>
                <div class="contact-person-block">
                    <div class="person-name">N.V.T</div>
                    <div class="person-info">N.V.T</div>
                    <div class="person-info">Nil</div>
                </div>
                <div class="contact-person-block">
                    <div class="person-name">N.V.T</div>
                    <div class="person-info">N.V.T</div>
                    <div class="person-info">Nil</div>
                </div>
                <div class="contact-person-block">
                    <div class="person-name">N.V.T</div>
                    <div class="person-info">N.V.T</div>
                    <div class="person-info">Nil</div>
                </div>
            </div>
            <div class="contact-card">
                <div class="card-title"><b>Contact details</b></div>
                <div class="contact-form">
                    <label class="person-label" for="contact-email">Your email</label>
                    <input id="contact-email" type="email" placeholder="Type your email">

                    <label class="person-label" for="recipient">Send to</label>
                    <select id="recipient">
                        <option value="Omar">N.V.T</option>
                        <option value="Ruben">N.V.T</option>
                        <option value="Musie">N.V.T</option>
                        <option value="Twan">N.V.T</option>
                    </select>

                    <label class="person-label" for="message">Your question or problem</label>
                    <textarea id="message" rows="6" placeholder="Type your message here..."></textarea>

                    <button type="button">Send</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
